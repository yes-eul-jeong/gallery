name: kickbox-portfolio

services:
  # 개발 서버. http://localhost:4321
  dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: kickbox-portfolio:dev
    working_dir: /app
    volumes:
      - ..:/app:delegated
    env_file:
      - ../.env
    ports:
      - "4321:4321"
    command: npm run dev

  # 일회성 명령 실행용. 업로드 CLI, 빌드, 설치
  app:
    image: kickbox-portfolio:dev
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    working_dir: /app
    volumes:
      - ..:/app:delegated
      # 원본 영상 디렉터리. 필요하면 경로를 바꾼다
      - ${MEDIA_SOURCE:-../media-source}:/media:ro
    env_file:
      - ../.env
    entrypoint: ["/bin/bash", "-lc"]

  # 미디어 Worker 개발 서버. http://localhost:8787
  worker:
    image: kickbox-portfolio:dev
    build:
      context: ..
      dockerfile: docker/Dockerfile
    working_dir: /app/worker
    volumes:
      - ..:/app:delegated
    ports:
      - "8787:8787"
    command: npx wrangler dev --port 8787 --ip 0.0.0.0
